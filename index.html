<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeSignal Guardian AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #edf2ec;
  color: #33473b;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 15px;
}

.chat-container {
  width: 100%;
  max-width: 480px;
  height: 85vh;
  max-height: 750px;
  background: #ffffff;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
}

.header {
  background: #647d69;
  color: white;
  padding: 22px;
}

.header h2 {
  margin: 0;
  font-size: 20px;
}

.header p {
  margin: 7px 0 0;
  font-size: 13px;
  opacity: 0.9;
}

.messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  padding: 13px 16px;
  border-radius: 18px;
  max-width: 85%;
  line-height: 1.5;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bot {
  background: #edf2ec;
  align-self: flex-start;
}

.user {
  background: #647d69;
  color: white;
  align-self: flex-end;
}

.input-area {
  padding: 15px;
  display: flex;
  gap: 10px;
  border-top: 1px solid #eeeeee;
}

input {
  flex: 1;
  padding: 14px;
  border: 1px solid #d6dfd5;
  border-radius: 14px;
  outline: none;
  min-width: 0;
}

button {
  border: none;
  background: #647d69;
  color: white;
  padding: 14px 18px;
  border-radius: 14px;
  cursor: pointer;
}

button:hover {
  background: #506654;
}

button:disabled {
  opacity: 0.5;
}

</style>
</head>

<body>

<div class="chat-container">

  <div class="header">
    <h2>SafeSignal Guardian AI</h2>
    <p>Your guide to understanding SafeSignal Guardian.</p>
  </div>

  <div class="messages" id="messages">
    <div class="message bot">
      Hello! I'm SafeSignal Guardian AI.

      I can help explain our product, its features,
      technology, modules and intended functions.

      What would you like to know?
    </div>
  </div>

  <div class="input-area">
    <input
      id="userInput"
      placeholder="Ask me something..."
      autocomplete="off"
    >
    <button id="sendButton" onclick="sendMessage()">Send</button>
  </div>

</div>

<script>

const input = document.getElementById("userInput");

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});

function addMessage(text, sender) {
  const messages = document.getElementById("messages");

  const div = document.createElement("div");
  div.className = "message " + sender;
  div.textContent = text;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  try {
    const response = await fetch(
      "https://safesignal-brain.m-11788569.workers.dev/",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: [
            { role: "user", content: text }
          ]
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error("Request failed");
    }

    addMessage(data.response, "bot");

  } catch (error) {
    addMessage(
      "Sorry! I couldn't connect to SafeSignal AI. Please try again.",
      "bot"
    );
  }
  }

</script>

</body>
  </html>
